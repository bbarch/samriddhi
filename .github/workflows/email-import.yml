name: Import memories from email

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # or run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: email-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow pillow-heif

      - name: Import emails
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALLOWED_SENDERS: ${{ secrets.ALLOWED_SENDERS }}
        run: python scripts/email_import.py

      - name: Commit and push new memories
        run: |
          git config user.name "memory-bot"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "New memories via email"
            git push
          else
            echo "Nothing new to publish."
          fi
