<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Capy's Day!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛁</text></svg>">
  <style>
    /* ---------- Capy stage ---------- */
    .capy-stage {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    .capy-stage svg { width: 100%; height: auto; display: block; }
    .capy-stage svg g { transform-box: fill-box; }

    #caption {
      text-align: center;
      font-family: var(--font-hand);
      font-size: 1.9rem;
      min-height: 2.6rem;
      margin: 0.4rem 0 1.2rem;
    }

    .capy-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
      max-width: 640px;
      margin: 0 auto;
    }
    .capy-btn {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      background: var(--card-bg);
      border: none;
      border-radius: 999px;
      padding: 0.65rem 1.3rem;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }
    .capy-btn:hover { transform: translateY(-3px); }
    .capy-btn.active {
      background: linear-gradient(90deg, var(--lavender), var(--pink));
      color: #fff;
    }
    @media (prefers-color-scheme: dark) { .capy-btn.active { color: #2c2745; } }

    /* ---------- Animations ---------- */
    /* Whole-capy moves */
    .do-jump #whole { animation: capy-jump 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes capy-jump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      15%      { transform: translateY(0) scale(1.06, 0.9); }
      45%      { transform: translateY(-52px) scale(0.98, 1.04); }
      75%      { transform: translateY(0) scale(1.08, 0.9); }
      85%      { transform: translateY(0) scale(1, 1); }
    }
    .do-shower #whole { animation: capy-shimmy 0.6s ease-in-out infinite; transform-origin: 50% 90%; }
    @keyframes capy-shimmy {
      0%, 100% { transform: rotate(-1.6deg); }
      50%      { transform: rotate(1.6deg); }
    }
    .do-fart #whole { animation: capy-lean 1.6s ease-in-out infinite; transform-origin: 50% 95%; }
    @keyframes capy-lean {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(-4deg) translateY(-3px); }
      35%      { transform: rotate(2deg); }
    }
    .do-brush #head { animation: head-tilt 0.9s ease-in-out infinite; transform-origin: 70% 80%; }
    @keyframes head-tilt {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-3deg); }
    }
    .do-comb #head { animation: head-tilt 1.4s ease-in-out infinite; transform-origin: 70% 80%; }

    /* Props: hidden via attribute opacity="0", shown by class */
    .do-brush #toothbrush,
    .do-brush #teeth,
    .do-brush #mouth-sparkle,
    .do-photo #camera,
    .do-photo #smile,
    .do-shower #shower,
    .do-shower #bubbles,
    .do-comb #comb,
    .do-comb #hairlines,
    .do-fart #stink { opacity: 1 !important; }
    .do-photo #mouth-neutral { opacity: 0 !important; }

    .do-brush #toothbrush { animation: brush-move 0.4s ease-in-out infinite alternate; }
    @keyframes brush-move {
      from { transform: translate(-6px, 0) rotate(-14deg); }
      to   { transform: translate(10px, 3px) rotate(-10deg); }
    }
    .do-brush #mouth-sparkle { animation: twinkle-loop 1.2s ease-in-out infinite; }

    .do-photo #camera { animation: cam-tilt 2s ease-in-out infinite; transform-origin: 50% 50%; }
    @keyframes cam-tilt {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(5deg) translateY(-4px); }
    }
    .do-photo #flash { animation: flash-blink 2s ease-out infinite; }
    @keyframes flash-blink {
      0%, 40%, 100% { opacity: 0; }
      46%           { opacity: 0.85; }
      58%           { opacity: 0; }
    }

    .do-shower #drops { animation: drops-fall 0.5s linear infinite; }
    @keyframes drops-fall {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -32; }
    }
    .do-shower #bubbles circle { animation: bubble-rise 1.8s ease-in infinite; transform-box: fill-box; }
    .do-shower #bubbles circle:nth-child(2) { animation-delay: 0.6s; }
    .do-shower #bubbles circle:nth-child(3) { animation-delay: 1.1s; }
    @keyframes bubble-rise {
      0%   { transform: translateY(0) scale(0.4); opacity: 0; }
      20%  { opacity: 0.9; }
      100% { transform: translateY(-70px) scale(1.1); opacity: 0; }
    }

    .do-comb #comb { animation: comb-move 1.4s ease-in-out infinite; }
    @keyframes comb-move {
      0%, 100% { transform: translate(0, 0) rotate(-6deg); }
      50%      { transform: translate(52px, 14px) rotate(14deg); }
    }
    .do-comb #hairlines path { animation: hair-wiggle 0.7s ease-in-out infinite alternate; transform-origin: 50% 100%; }
    @keyframes hair-wiggle {
      from { transform: rotate(-8deg); }
      to   { transform: rotate(10deg); }
    }

    .do-scratch #arm { animation: arm-scratch 0.9s ease-in-out infinite; transform-origin: 85% 20%; }
    @keyframes arm-scratch {
      0%, 100% { transform: rotate(0deg); }
      40%      { transform: rotate(-118deg); }
      55%      { transform: rotate(-108deg); }
      70%      { transform: rotate(-120deg); }
    }
    .do-scratch #nose { animation: nose-twitch 0.5s ease-in-out infinite alternate; transform-origin: 50% 50%; }
    @keyframes nose-twitch {
      from { transform: scale(1); }
      to   { transform: scale(1.25) rotate(6deg); }
    }

    .do-fart #stink g { animation: puff 1.6s ease-out infinite; transform-origin: 20% 80%; }
    .do-fart #stink g:nth-child(2) { animation-delay: 0.5s; }
    @keyframes puff {
      0%   { transform: translate(0, 0) scale(0.3); opacity: 0; }
      20%  { opacity: 0.8; }
      100% { transform: translate(34px, -30px) scale(1.5); opacity: 0; }
    }

    @keyframes twinkle-loop {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50%      { opacity: 1; transform: scale(1.2) rotate(30deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .capy-stage *, .capy-btn { animation: none !important; transition: none; }
    }
  </style>
</head>
<body data-magic="full">

  <header class="site-header">
    <h1 class="site-title"><a href="index.html" style="color:inherit;-webkit-text-fill-color:inherit;">Capy's Day!</a></h1>
    <p class="site-tagline">shhh… you found the secret page 🤫</p>
  </header>

  <main>
    <div class="capy-stage" id="stage">
      <svg viewBox="0 0 460 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A friendly sketched capybara">
        <!-- flash overlay for photo -->
        <rect id="flash" x="0" y="0" width="460" height="360" fill="#ffffff" opacity="0"/>

        <!-- shower (fixed, above capy) -->
        <g id="shower" opacity="0">
          <path d="M 232 6 h 60 v 14 h -18 v 10 h -24 v -10 h -18 z" fill="#9aa7bd" stroke="#6e7a8f" stroke-width="3" stroke-linejoin="round"/>
          <g id="drops" stroke="#a8cef0" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="7 25" fill="none">
            <path d="M 226 38 v 120"/>
            <path d="M 244 38 v 130"/>
            <path d="M 262 38 v 118"/>
            <path d="M 280 38 v 126"/>
          </g>
        </g>

        <!-- stink puffs (behind capy) -->
        <g id="stink" opacity="0">
          <g>
            <circle cx="382" cy="286" r="14" fill="#cfe3b8" opacity="0.9"/>
            <circle cx="398" cy="274" r="9" fill="#dcebc9" opacity="0.9"/>
          </g>
          <g>
            <circle cx="376" cy="296" r="9" fill="#dcebc9" opacity="0.9"/>
            <circle cx="392" cy="292" r="6" fill="#cfe3b8" opacity="0.9"/>
          </g>
        </g>

        <!-- THE CAPYBARA -->
        <g id="whole">
          <!-- body -->
          <rect x="128" y="152" width="230" height="156" rx="72" fill="#c9a27a" stroke="#7a5c3e" stroke-width="4"/>
          <!-- neck bridge (fills the gap between chin and chest) -->
          <rect x="132" y="150" width="72" height="72" fill="#c9a27a" stroke="none"/>
          <ellipse cx="250" cy="262" rx="88" ry="42" fill="#dcbd97" stroke="none"/>
          <!-- fur strokes on back -->
          <g stroke="#7a5c3e" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
            <path d="M 210 158 q 4 -10 10 -12"/>
            <path d="M 250 152 q 4 -10 10 -12"/>
            <path d="M 292 156 q 4 -10 10 -12"/>
          </g>
          <!-- back leg -->
          <rect x="286" y="262" width="34" height="48" rx="15" fill="#bd9066" stroke="#7a5c3e" stroke-width="4"/>
          <!-- front leg -->
          <rect x="176" y="264" width="28" height="46" rx="13" fill="#c9a27a" stroke="#7a5c3e" stroke-width="4"/>

          <!-- scratching arm (pivots at shoulder) -->
          <g id="arm">
            <rect x="148" y="206" width="24" height="74" rx="12" fill="#c9a27a" stroke="#7a5c3e" stroke-width="4"/>
            <ellipse cx="160" cy="276" rx="13" ry="9" fill="#bd9066" stroke="#7a5c3e" stroke-width="3"/>
          </g>

          <!-- head (outer group seats it snugly on the body) -->
          <g transform="translate(2, 16)">
          <g id="head">
            <!-- ears first (behind head box) -->
            <ellipse cx="118" cy="78" rx="15" ry="13" fill="#bd9066" stroke="#7a5c3e" stroke-width="4"/>
            <ellipse cx="176" cy="76" rx="15" ry="13" fill="#bd9066" stroke="#7a5c3e" stroke-width="4"/>
            <rect x="56" y="72" width="152" height="122" rx="46" fill="#c9a27a" stroke="#7a5c3e" stroke-width="4"/>
            <!-- muzzle shading -->
            <path d="M 58 118 q -4 40 22 62 q 20 14 46 12 l 0 -20 q -30 -4 -44 -24 q -12 -16 -10 -30 z" fill="#bd9066" opacity="0.55" stroke="none"/>
            <!-- eye -->
            <circle cx="128" cy="118" r="8" fill="#463625"/>
            <circle cx="125" cy="115" r="2.6" fill="#ffffff"/>
            <!-- nose -->
            <g id="nose">
              <ellipse cx="74" cy="106" rx="12" ry="9" fill="#8f6b48"/>
              <ellipse cx="70" cy="104" rx="3" ry="4" fill="#463625"/>
              <ellipse cx="80" cy="104" rx="3" ry="4" fill="#463625"/>
            </g>
            <!-- mouth -->
            <path id="mouth-neutral" d="M 74 138 q 10 10 26 7" fill="none" stroke="#7a5c3e" stroke-width="3.5" stroke-linecap="round"/>
            <path id="smile" opacity="0" d="M 66 134 q 18 26 46 12" fill="none" stroke="#7a5c3e" stroke-width="4" stroke-linecap="round"/>
            <!-- teeth (capybaras have great ones) -->
            <g id="teeth" opacity="0">
              <rect x="82" y="140" width="9" height="12" rx="2" fill="#fffdf4" stroke="#7a5c3e" stroke-width="2"/>
              <rect x="93" y="140" width="9" height="12" rx="2" fill="#fffdf4" stroke="#7a5c3e" stroke-width="2"/>
            </g>
            <text id="mouth-sparkle" x="104" y="136" font-size="20" fill="#e8b64c" opacity="0">✦</text>
            <!-- whisker dots -->
            <g fill="#7a5c3e" opacity="0.6">
              <circle cx="92" cy="122" r="1.8"/>
              <circle cx="102" cy="126" r="1.8"/>
              <circle cx="94" cy="131" r="1.8"/>
            </g>
            <!-- comb-able hair tuft -->
            <g id="hairlines" opacity="0" stroke="#7a5c3e" stroke-width="3" stroke-linecap="round" fill="none">
              <path d="M 110 70 q -2 -14 2 -18"/>
              <path d="M 128 66 q 0 -14 5 -18"/>
              <path d="M 146 66 q 2 -14 8 -16"/>
              <path d="M 164 70 q 4 -12 10 -14"/>
            </g>
          </g>
          </g>
        </g>

        <!-- shower bubbles (in front of capy) -->
        <g id="bubbles" opacity="0" fill="#dbeafd" stroke="#a8cef0" stroke-width="2">
          <circle cx="160" cy="250" r="9"/>
          <circle cx="336" cy="262" r="12"/>
          <circle cx="296" cy="234" r="7"/>
        </g>

        <!-- toothbrush -->
        <g id="toothbrush" opacity="0">
          <g transform="translate(50, 164) rotate(-12)">
            <rect x="0" y="8" width="58" height="9" rx="4.5" fill="#f2a4c6" stroke="#c9799f" stroke-width="2.5"/>
            <rect x="0" y="0" width="17" height="11" rx="2" fill="#ffffff" stroke="#c9799f" stroke-width="2.5"/>
          </g>
        </g>

        <!-- camera -->
        <g id="camera" opacity="0">
          <rect x="330" y="70" width="66" height="46" rx="9" fill="#8b83a1" stroke="#5f5876" stroke-width="3.5"/>
          <circle cx="363" cy="93" r="15" fill="#dcd6ec" stroke="#5f5876" stroke-width="3.5"/>
          <circle cx="363" cy="93" r="6" fill="#5f5876"/>
          <rect x="338" y="62" width="18" height="10" rx="3" fill="#8b83a1" stroke="#5f5876" stroke-width="3"/>
          <text x="398" y="66" font-size="22" fill="#e8b64c">✦</text>
        </g>

        <!-- comb -->
        <g id="comb" opacity="0">
          <g transform="translate(96, 18)">
            <rect x="0" y="0" width="52" height="11" rx="5" fill="#a8cef0" stroke="#6f9cc4" stroke-width="2.5"/>
            <g stroke="#6f9cc4" stroke-width="3" stroke-linecap="round">
              <path d="M 7 11 v 10"/><path d="M 17 11 v 10"/><path d="M 27 11 v 10"/>
              <path d="M 37 11 v 10"/><path d="M 46 11 v 10"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <p id="caption">What should Capy do today?</p>

    <div class="capy-buttons">
      <button class="capy-btn" data-act="brush">🪥 Brush teeth</button>
      <button class="capy-btn" data-act="jump">🦘 Jump up &amp; down</button>
      <button class="capy-btn" data-act="photo">📸 Smile for a photo</button>
      <button class="capy-btn" data-act="shower">🚿 Take a shower</button>
      <button class="capy-btn" data-act="comb">💇 Comb hair</button>
      <button class="capy-btn" data-act="scratch">👃 Scratch your nose</button>
      <button class="capy-btn" data-act="fart">💨 Do a farty-farty</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="stars">✦ ✧ ✦</div>
    <p><a href="index.html" style="color:inherit;">← back to the magical world</a></p>
  </footer>

  <script src="js/magic.js"></script>
  <script>
    (function () {
      var stage = document.getElementById("stage");
      var caption = document.getElementById("caption");
      var buttons = document.querySelectorAll(".capy-btn");
      var timer = null;

      var captions = {
        brush:   "Scrub scrub scrub! Sparkly teeth! ✨",
        jump:    "Boing! Boing! Boing!",
        photo:   "Say cheeeese!",
        shower:  "Splish splash splish!",
        comb:    "So fluffy, so handsome!",
        scratch: "Scratchy scratchy… ahhh!",
        fart:    "Oopsie!! Teehee! 💨"
      };

      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var act = btn.dataset.act;
          clearTimeout(timer);
          stage.className = "capy-stage";           // reset any running act
          buttons.forEach(function (b) { b.classList.remove("active"); });
          void stage.offsetWidth;                    // restart CSS animations
          stage.className = "capy-stage do-" + act;
          btn.classList.add("active");
          caption.textContent = captions[act];
          timer = setTimeout(function () {
            stage.className = "capy-stage";
            btn.classList.remove("active");
            caption.textContent = "What should Capy do today?";
          }, 6000);
        });
      });
    })();
  </script>
</body>
</html>
